<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nhật Ký Của Con - Nguyễn Quỳnh Anh (Kem)</title>
  
  <!-- Cấu hình PWA & iOS Home Screen Icon -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nhật Ký Của Con">
  <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1544126592-807ade215a0b?auto=format&fit=crop&q=80&w=180&h=180">
  
  <!-- Font Awesome CDN cho Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <style>
    :root {
      --primary-color: #ff477e;
      --primary-hover: #ff2a6d;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #2b2d42;
      --text-muted: #6c757d;
      --border-color: #e9ecef;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      --badge-bg: #ffe5ec;
      --badge-color: #d80032;
      --topbar-height: 70px;
      --navbar-height: 60px;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f8f9fa;
      --text-muted: #a0a0a0;
      --border-color: #2d2d2d;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      --badge-bg: #3d0016;
      --badge-color: #ff758f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
      padding-top: calc(var(--topbar-height) + 12px);
      padding-bottom: calc(var(--navbar-height) + 20px);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 12px;
    }

    /* TOPBAR CỐ ĐỊNH */
    header.sticky-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--topbar-height);
      background-color: var(--card-bg);
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .topbar-content {
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .app-branding {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .avatar-wrapper {
      position: relative;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-color);
    }

    .avatar-edit-btn {
      position: absolute;
      bottom: -2px;
      right: -2px;
      background: var(--primary-color);
      color: white;
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .app-title-group {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .app-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sync-status {
      font-size: 11px;
      color: #2ec4b6;
      margin-left: 4px;
    }

    .baby-name {
      font-size: 12px;
      color: var(--primary-color);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s ease;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .theme-toggle {
      width: 38px;
      height: 38px;
      aspect-ratio: 1/1;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px var(--border-color);
    }

    .btn-add {
      background: linear-gradient(135deg, var(--primary-color), #ff758f);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 71, 126, 0.3);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* BOTTOM NAVBAR (3 TAB) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--navbar-height);
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 900;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.05);
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 100%;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: none;
      transition: color 0.2s;
    }

    .nav-item i {
      font-size: 18px;
    }

    .nav-item.active {
      color: var(--primary-color);
    }

    /* CONTENT TABS */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .album-card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .album-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .age-badge {
      background-color: var(--badge-bg);
      color: var(--badge-color);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .family-badge {
      background-color: #e3f2fd;
      color: #1976d2;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .album-date {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .album-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-color);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      border-radius: 14px;
      overflow: hidden;
    }

    .photo-item {
      position: relative;
      aspect-ratio: 1/1;
      background-color: var(--border-color);
      overflow: hidden;
      cursor: pointer;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .more-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }

    .more-overlay span {
      font-size: 11px;
      font-weight: 400;
      margin-top: 2px;
    }

    .album-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
    }

    /* GRID TAB BỘ ẢNH CONTINUOUS */
    .all-photos-section {
      margin-bottom: 24px;
    }

    .section-date-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-color);
      padding: 8px 4px;
      position: sticky;
      top: var(--topbar-height);
      background-color: var(--bg-color);
      z-index: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .all-photos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-top: 4px;
    }

    /* MODAL FORM */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      backdrop-filter: blur(4px);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 24px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--primary-color);
    }

    .btn-close {
      background: var(--bg-color);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-color);
    }

    input[type="date"], input[type="text"], select {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      -webkit-appearance: none;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 14px;
      outline: none;
    }

    .dropzone {
      border: 2px dashed var(--primary-color);
      background-color: var(--badge-bg);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .dropzone i {
      font-size: 28px;
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    .dropzone p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .preview-list {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1/1;
      border-radius: 8px;
      overflow: hidden;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 10px;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-secondary {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    /* LIGHTBOX FULLSCREEN */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2000;
      padding: 20px 10px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-header {
      display: flex;
      justify-content: space-between;
      color: white;
      padding: 10px;
    }

    .lightbox-img-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }

    input[type="file"] {
      display: none;
    }

    /* LOADING SPINNER */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }
    .loading-overlay.active { display: flex; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- LOADING OVERLAY -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>

  <!-- HEADER TOPBAR CỐ ĐỊNH -->
  <header class="sticky-topbar">
    <div class="topbar-content">
      <div class="app-branding">
        <div class="avatar-wrapper">
          <img id="baby-avatar" class="avatar-img" src="https://images.unsplash.com/photo-1544126592-807ade215a0b?auto=format&fit=crop&q=80&w=200" alt="Bé Kem">
          <button class="avatar-edit-btn" onclick="document.getElementById('avatar-input').click()"><i class="fa-solid fa-camera"></i></button>
        </div>
        <div class="app-title-group">
          <div class="app-title">
            Nhật Ký Của Con 🍼
            <span class="sync-status" title="Tự động đồng bộ Online"><i class="fa-solid fa-cloud"></i></span>
          </div>
          <div class="baby-name" id="topbar-subtext">Nguyễn Quỳnh Anh (Bé Kem) 💖</div>
        </div>
      </div>
      
      <div class="header-actions">
        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button class="btn-add" onclick="openModal()">
          <i class="fa-solid fa-plus"></i> Thêm
        </button>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- TAB 1: ALBUM KỶ NIỆM BÉ KEM -->
    <main id="tab-albums" class="tab-content active"></main>

    <!-- TAB 2: TOÀN BỘ ẢNH BÉ KEM -->
    <main id="tab-photos" class="tab-content"></main>

    <!-- TAB 3: ALBUM GIA ĐÌNH -->
    <main id="tab-family" class="tab-content"></main>
  </div>

  <!-- BOTTOM NAVBAR (3 TAB) -->
  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-albums" onclick="switchTab('albums')">
      <i class="fa-solid fa-book-bookmark"></i>
      <span>Kỷ Niệm</span>
    </button>
    <button class="nav-item" id="nav-photos" onclick="switchTab('photos')">
      <i class="fa-solid fa-images"></i>
      <span>Bộ Ảnh</span>
    </button>
    <button class="nav-item" id="nav-family" onclick="switchTab('family')">
      <i class="fa-solid fa-people-roof"></i>
      <span>Gia Đình</span>
    </button>
  </nav>

  <!-- MODAL THÊM / SỬA ALBUM -->
  <div class="modal" id="album-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modal-title-text"><i class="fa-solid fa-images"></i> Thêm Kỷ Niệm Mới</div>
        <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <form id="album-form" onsubmit="saveAlbum(event)">
        <div class="form-group">
          <label class="form-label">Loại Kỷ Niệm *</label>
          <select id="album-type-input" onchange="updateAgePreview()">
            <option value="baby">👶 Album Bé Kem</option>
            <option value="family">🏡 Album Gia Đình</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Ngày chụp / Đăng ảnh *</label>
          <input type="date" id="album-date-input" required onchange="updateAgePreview()">
          <div id="age-preview" style="font-size:12px; color:var(--primary-color); margin-top:6px; font-weight:600;"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Tiêu đề / Ghi chú ngắn</label>
          <input type="text" id="album-title-input" placeholder="Ví dụ: Bé tập lẫy, Cả nhà đi du lịch...">
        </div>

        <div class="form-group">
          <label class="form-label">Ảnh trong album (Tối đa 10 ảnh) *</label>
          <div class="dropzone" onclick="document.getElementById('photos-input').click()">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <p>Nhấp để chọn ảnh từ điện thoại/máy tính</p>
          </div>
          <div class="preview-list" id="preview-list"></div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">Hủy bỏ</button>
          <button type="submit" class="btn-primary">✓ Lưu Kỷ Niệm</button>
        </div>
      </form>
    </div>
  </div>

  <!-- LIGHTBOX FULLSCREEN -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-header">
      <span id="lightbox-counter">1/1</span>
      <i class="fa-solid fa-xmark" style="font-size:20px; cursor:pointer;"></i>
    </div>
    <div class="lightbox-img-container">
      <img id="lightbox-img" class="lightbox-img" src="" alt="Full view">
    </div>
  </div>

  <!-- INPUT FILE ẨN -->
  <input type="file" id="avatar-input" accept="image/*" onchange="changeAvatar(event)">
  <input type="file" id="photos-input" accept="image/*" multiple onchange="handlePhotosSelect(event)">

  <script>
    // 1. CẤU HÌNH FIREBASE THỰC TẾ CỦA BẠN
    const firebaseConfig = {
      apiKey: "AIzaSyAmjZ-_WjdM934wTffiNuygAfk6L_qSJHg",
      authDomain: "nhat-ky-cua-kem.firebaseapp.com",
      projectId: "nhat-ky-cua-kem",
      storageBucket: "nhat-ky-cua-kem.firebasestorage.app",
      messagingSenderId: "306999711539",
      appId: "1:306999711539:web:9f033c0213306e95495046",
      measurementId: "G-BSZ19J28GR"
    };

    // Khởi tạo Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // NGÀY SINH BÉ KEM: 17/09/2025
    const BABY_BIRTHDAY = new Date('2025-09-17');
    
    let albums = JSON.parse(localStorage.getItem('kem_albums')) || [];
    let currentPhotos = [];
    let editingId = null;
    let activeLightboxPhotos = [];
    let activeLightboxIndex = 0;
    let currentTab = 'albums';

    // ĐỒNG BỘ REALTIME TỪ FIREBASE CLOUD
    function initRealtimeSync() {
      db.collection("albums").onSnapshot((snapshot) => {
        let firebaseAlbums = [];
        snapshot.forEach((doc) => {
          firebaseAlbums.push({ id: doc.id, ...doc.data() });
        });

        // Sắp xếp theo ngày mới nhất lên đầu
        firebaseAlbums.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (firebaseAlbums.length > 0) {
          albums = firebaseAlbums;
          localStorage.setItem('kem_albums', JSON.stringify(albums));
          renderAllTabs();
        }
      }, (error) => {
        console.log("Đang chạy ở chế độ offline local:", error);
        renderAllTabs();
      });
    }

    // TÍNH TUỔI BÉ KEM
    function calculateBabyAge(dateString) {
      const targetDate = new Date(dateString);
      let months = (targetDate.getFullYear() - BABY_BIRTHDAY.getFullYear()) * 12 + (targetDate.getMonth() - BABY_BIRTHDAY.getMonth());
      let days = targetDate.getDate() - BABY_BIRTHDAY.getDate();

      if (days < 0) {
        months--;
        const prevMonthLastDay = new Date(targetDate.getFullYear(), targetDate.getMonth(), 0).getDate();
        days += prevMonthLastDay;
      }

      if (months < 0) return 'Mới sinh';
      return `${months} Tháng ${days} Ngày Tuổi`;
    }

    // CHUYỂN TAB CẢNH MÀN HÌNH
    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      if (tabName === 'albums') {
        document.getElementById('tab-albums').classList.add('active');
        document.getElementById('nav-albums').classList.add('active');
        document.getElementById('topbar-subtext').innerText = 'Nguyễn Quỳnh Anh (Bé Kem) 💖';
        renderBabyAlbums();
      } else if (tabName === 'photos') {
        document.getElementById('tab-photos').classList.add('active');
        document.getElementById('nav-photos').classList.add('active');
        renderAllPhotosTab();
      } else if (tabName === 'family') {
        document.getElementById('tab-family').classList.add('active');
        document.getElementById('nav-family').classList.add('active');
        document.getElementById('topbar-subtext').innerText = 'Kỷ Niệm Gia Đình 🏡';
        renderFamilyAlbums();
      }
    }

    function renderAllTabs() {
      renderBabyAlbums();
      renderFamilyAlbums();
      if (currentTab === 'photos') {
        renderAllPhotosTab();
      }
    }

    // RENDER TAB 1: ALBUM BÉ KEM (Đảm bảo lọc linh hoạt mọi loại dữ liệu cũ và mới)
    function renderBabyAlbums() {
      const container = document.getElementById('tab-albums');
      container.innerHTML = '';
      
      const babyAlbums = albums.filter(a => a.type === 'baby' || !a.type);

      if (babyAlbums.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color:var(--text-muted);">Chưa có kỷ niệm nào của bé Kem. Hãy bấm nút Thêm nhé! 🍼</div>';
        return;
      }

      babyAlbums.forEach(album => {
        const ageText = calculateBabyAge(album.date);
        const formattedDate = new Date(album.date).toLocaleDateString('vi-VN');
        const photoCount = album.photos ? album.photos.length : 0;

        let gridHtml = '';
        const displayPhotos = album.photos ? album.photos.slice(0, 6) : [];
        displayPhotos.forEach((photo, idx) => {
          const isLast = idx === 5 && photoCount > 6;
          gridHtml += `
            <div class="photo-item" onclick="openLightboxPhotos('${album.id}', ${idx})">
              <img src="${photo}" alt="Ảnh bé Kem">
              ${isLast ? `<div class="more-overlay">+${photoCount - 6}<span>${photoCount} ảnh</span></div>` : ''}
            </div>
          `;
        });

        const card = document.createElement('div');
        card.className = 'album-card';
        card.innerHTML = `
          <div class="album-header">
            <div class="age-badge"><i class="fa-solid fa-heart"></i> ${ageText}</div>
            <div class="album-date"><i class="fa-regular fa-calendar"></i> ${formattedDate}</div>
          </div>
          ${album.title ? `<div class="album-title">${album.title}</div>` : ''}
          <div class="photo-grid">${gridHtml}</div>
          <div class="album-footer">
            <button class="btn-icon" onclick="editAlbum('${album.id}')"><i class="fa-solid fa-pen-to-square"></i> Sửa</button>
            <button class="btn-icon" onclick="deleteAlbum('${album.id}')" style="color:#d80032;"><i class="fa-solid fa-trash"></i> Xóa</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // RENDER TAB 3: ALBUM GIA ĐÌNH
    function renderFamilyAlbums() {
      const container = document.getElementById('tab-family');
      container.innerHTML = '';
      
      const familyAlbums = albums.filter(a => a.type === 'family');

      if (familyAlbums.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color:var(--text-muted);">Chưa có kỷ niệm gia đình nào. Hãy bấm nút Thêm nhé! 🏡</div>';
        return;
      }

      familyAlbums.forEach(album => {
        const formattedDate = new Date(album.date).toLocaleDateString('vi-VN');
        const photoCount = album.photos ? album.photos.length : 0;

        let gridHtml = '';
        const displayPhotos = album.photos ? album.photos.slice(0, 6) : [];
        displayPhotos.forEach((photo, idx) => {
          const isLast = idx === 5 && photoCount > 6;
          gridHtml += `
            <div class="photo-item" onclick="openLightboxPhotos('${album.id}', ${idx})">
              <img src="${photo}" alt="Ảnh gia đình">
              ${isLast ? `<div class="more-overlay">+${photoCount - 6}<span>${photoCount} ảnh</span></div>` : ''}
            </div>
          `;
        });

        const card = document.createElement('div');
        card.className = 'album-card';
        card.innerHTML = `
          <div class="album-header">
            <div class="family-badge"><i class="fa-solid fa-house-chimney"></i> Gia Đình</div>
            <div class="album-date"><i class="fa-regular fa-calendar"></i> ${formattedDate}</div>
          </div>
          ${album.title ? `<div class="album-title">${album.title}</div>` : ''}
          <div class="photo-grid">${gridHtml}</div>
          <div class="album-footer">
            <button class="btn-icon" onclick="editAlbum('${album.id}')"><i class="fa-solid fa-pen-to-square"></i> Sửa</button>
            <button class="btn-icon" onclick="deleteAlbum('${album.id}')" style="color:#d80032;"><i class="fa-solid fa-trash"></i> Xóa</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // RENDER TAB 2: TOÀN BỘ ẢNH BÉ KEM
    function renderAllPhotosTab() {
      const container = document.getElementById('tab-photos');
      container.innerHTML = '';
      
      const babyAlbums = albums.filter(a => a.type === 'baby' || !a.type);

      if (babyAlbums.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color:var(--text-muted);">Chưa có bức ảnh nào của bé Kem.</div>';
        return;
      }

      babyAlbums.forEach(album => {
        if (!album.photos || album.photos.length === 0) return;

        const section = document.createElement('div');
        section.className = 'all-photos-section';
        section.dataset.date = album.date;
        section.dataset.age = calculateBabyAge(album.date);

        const dateHeader = `
          <div class="section-date-header">
            <span>📅 ${new Date(album.date).toLocaleDateString('vi-VN')}</span>
            <span>👶 ${calculateBabyAge(album.date)}</span>
          </div>
        `;

        let photosGrid = '<div class="all-photos-grid">';
        album.photos.forEach((photo) => {
          photosGrid += `
            <div class="photo-item" onclick="openLightboxDirect('${photo}')">
              <img src="${photo}" alt="Ảnh bé Kem">
            </div>
          `;
        });
        photosGrid += '</div>';

        section.innerHTML = dateHeader + photosGrid;
        container.appendChild(section);
      });

      window.removeEventListener('scroll', handleScrollTopBar);
      window.addEventListener('scroll', handleScrollTopBar);
      handleScrollTopBar();
    }

    function handleScrollTopBar() {
      if (currentTab !== 'photos') return;
      const sections = document.querySelectorAll('.all-photos-section');
      let currentSection = null;

      sections.forEach(sec => {
        const rect = sec.getBoundingClientRect();
        if (rect.top <= 120 && rect.bottom >= 100) {
          currentSection = sec;
        }
      });

      if (currentSection) {
        const dateStr = new Date(currentSection.dataset.date).toLocaleDateString('vi-VN');
        const ageStr = currentSection.dataset.age;
        document.getElementById('topbar-subtext').innerText = `📅 ${dateStr} (${ageStr})`;
      }
    }

    // MODAL HANDLERS
    function openModal(isEdit = false) {
      document.getElementById('album-modal').classList.add('active');
      if (!isEdit) {
        editingId = null;
        document.getElementById('modal-title-text').innerText = 'Thêm Kỷ Niệm Mới';
        document.getElementById('album-type-input').value = currentTab === 'family' ? 'family' : 'baby';
        document.getElementById('album-date-input').value = new Date().toISOString().split('T')[0];
        document.getElementById('album-title-input').value = '';
        currentPhotos = [];
        renderPreviews();
        updateAgePreview();
      }
    }

    function closeModal() {
      document.getElementById('album-modal').classList.remove('active');
    }

    function updateAgePreview() {
      const type = document.getElementById('album-type-input').value;
      const dateVal = document.getElementById('album-date-input').value;
      const previewEl = document.getElementById('age-preview');

      if (type === 'baby' && dateVal) {
        previewEl.innerText = '👶 Tuổi bé Kem khi chụp: ' + calculateBabyAge(dateVal);
      } else {
        previewEl.innerText = '🏡 Album Kỷ Niệm Gia Đình';
      }
    }

    function handlePhotosSelect(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        if (currentPhotos.length < 10) {
          const reader = new FileReader();
          reader.onload = (event) => {
            currentPhotos.push(event.target.result);
            renderPreviews();
          };
          reader.readAsDataURL(file);
        }
      });
    }

    function renderPreviews() {
      const container = document.getElementById('preview-list');
      container.innerHTML = '';
      currentPhotos.forEach((photo, idx) => {
        container.innerHTML += `
          <div class="preview-item">
            <img src="${photo}">
            <button class="preview-remove" onclick="removePreview(${idx})">✕</button>
          </div>
        `;
      });
    }

    function removePreview(idx) {
      currentPhotos.splice(idx, 1);
      renderPreviews();
    }

    // LƯU KỶ NIỆM (ĐỒNG BỘ ĐÁM MÂY)
    async function saveAlbum(e) {
      e.preventDefault();
      if (currentPhotos.length === 0) {
        alert('Vui lòng chọn ít nhất 1 bức ảnh!');
        return;
      }

      document.getElementById('loading').classList.add('active');

      const type = document.getElementById('album-type-input').value;
      const date = document.getElementById('album-date-input').value;
      const title = document.getElementById('album-title-input').value;

      const albumData = {
        type,
        date,
        title,
        photos: currentPhotos,
        updatedAt: new Date().toISOString()
      };

      try {
        if (editingId) {
          await db.collection("albums").doc(editingId).set(albumData, { merge: true });
        } else {
          const newDoc = await db.collection("albums").add(albumData);
          albumData.id = newDoc.id;
        }

        // Cập nhật bộ nhớ Local ngay lập tức
        const index = albums.findIndex(a => a.id === editingId);
        if (index !== -1) {
          albums[index] = { id: editingId, ...albumData };
        } else {
          albums.unshift({ id: albumData.id || Date.now().toString(), ...albumData });
        }

        localStorage.setItem('kem_albums', JSON.stringify(albums));
        renderAllTabs();
        closeModal();
      } catch (err) {
        console.error("Lỗi đồng bộ Firebase:", err);
        localStorage.setItem('kem_albums', JSON.stringify(albums));
        renderAllTabs();
        closeModal();
      } finally {
        document.getElementById('loading').classList.remove('active');
      }
    }

    function editAlbum(id) {
      const album = albums.find(a => a.id === id);
      if (!album) return;
      editingId = id;
      document.getElementById('modal-title-text').innerText = 'Chỉnh Sửa Kỷ Niệm';
      document.getElementById('album-type-input').value = album.type || 'baby';
      document.getElementById('album-date-input').value = album.date;
      document.getElementById('album-title-input').value = album.title || '';
      currentPhotos = [...album.photos];
      renderPreviews();
      updateAgePreview();
      openModal(true);
    }

    async function deleteAlbum(id) {
      if (confirm('Bạn có chắc chắn muốn xóa kỷ niệm này không?')) {
        document.getElementById('loading').classList.add('active');
        try {
          await db.collection("albums").doc(id).delete();
        } catch (err) {
          console.log("Xóa offline local");
        }
        albums = albums.filter(a => a.id !== id);
        localStorage.setItem('kem_albums', JSON.stringify(albums));
        renderAllTabs();
        document.getElementById('loading').classList.remove('active');
      }
    }

    // ĐỔI AVATAR VÀ THEME
    function changeAvatar(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          document.getElementById('baby-avatar').src = event.target.result;
          localStorage.setItem('kem_avatar', event.target.result);
        };
        reader.readAsDataURL(file);
      }
    }

    function toggleTheme() {
      const body = document.documentElement;
      const current = body.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      body.setAttribute('data-theme', next);
      localStorage.setItem('kem_theme', next);
      document.getElementById('theme-btn').innerHTML = next === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    }

    // LIGHTBOX FULLSCREEN
    function openLightboxPhotos(albumId, photoIdx) {
      const album = albums.find(a => a.id === albumId);
      if (!album) return;
      activeLightboxPhotos = album.photos;
      activeLightboxIndex = photoIdx;
      updateLightbox();
      document.getElementById('lightbox').classList.add('active');
    }

    function openLightboxDirect(photoUrl) {
      activeLightboxPhotos = [photoUrl];
      activeLightboxIndex = 0;
      updateLightbox();
      document.getElementById('lightbox').classList.add('active');
    }

    function updateLightbox() {
      document.getElementById('lightbox-img').src = activeLightboxPhotos[activeLightboxIndex];
      document.getElementById('lightbox-counter').innerText = `${activeLightboxIndex + 1} / ${activeLightboxPhotos.length}`;
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    // INIT APP
    window.onload = () => {
      const savedAvatar = localStorage.getItem('kem_avatar');
      if (savedAvatar) document.getElementById('baby-avatar').src = savedAvatar;

      const savedTheme = localStorage.getItem('kem_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.getElementById('theme-btn').innerHTML = savedTheme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';

      renderAllTabs();
      initRealtimeSync();
    };
  </script>
</body>
</html>
